<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; connect-src 'self'">
<title>账号信息登记 · 演示页面</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f7cff'/%3E%3Cpath d='M16 9a4 4 0 110 8 4 4 0 010-8zm-7 14a7 7 0 0114 0z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="notice" role="note">
  <strong>演示页面</strong>
  <span>你填写的内容会提交并存储在本站的 Cloudflare KV 中，仅用于演示登记。本页不收集密码、令牌等凭证信息。</span>
</div>

<main class="card">
  <header class="card-head">
    <h1>账号信息登记</h1>
    <p>请填写你的账号基本信息，带 <span class="req">*</span> 的为必填项。</p>
  </header>

  <form id="profile-form" novalidate>
    <input type="text" id="website" name="website" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">

    <div class="field">
      <label for="account-name">账号名称 <span class="req">*</span></label>
      <input type="text" id="account-name" name="accountName" autocomplete="off" maxlength="40" placeholder="例如：zhang_san">
      <p class="error" data-error-for="account-name"></p>
    </div>

    <div class="field">
      <label for="platform">所属平台 <span class="req">*</span></label>
      <select id="platform" name="platform">
        <option value="">请选择</option>
        <option value="微信">微信</option>
        <option value="微博">微博</option>
        <option value="抖音">抖音</option>
        <option value="GitHub">GitHub</option>
        <option value="其他">其他</option>
      </select>
      <p class="error" data-error-for="platform"></p>
    </div>

    <div class="field">
      <label for="email">联系邮箱 <span class="req">*</span></label>
      <input type="email" id="email" name="email" autocomplete="off" maxlength="80" placeholder="例如：name@example.com">
      <p class="error" data-error-for="email"></p>
    </div>

    <div class="field">
      <label for="homepage">主页链接 <span class="optional">选填</span></label>
      <input type="url" id="homepage" name="homepage" autocomplete="off" maxlength="200" placeholder="https://">
      <p class="error" data-error-for="homepage"></p>
    </div>

    <div class="field">
      <label for="remark">备注 <span class="optional">选填</span></label>
      <textarea id="remark" name="remark" rows="3" maxlength="200" placeholder="想补充说明的内容"></textarea>
      <p class="error" data-error-for="remark"></p>
      <p class="hint"><span id="remark-count">0</span>/200</p>
    </div>

    <p class="banner" id="submit-banner" role="alert" hidden></p>

    <div class="actions">
      <button type="submit" class="btn btn-primary">提交</button>
      <button type="button" class="btn btn-ghost" id="reset-btn">清空</button>
    </div>
  </form>

  <section class="result" id="result" hidden aria-live="polite">
    <h2>提交成功</h2>
    <p class="result-note">以下内容已提交并存储，同时回显在你本地的页面上。</p>
    <dl id="result-list"></dl>
    <button type="button" class="btn btn-ghost" id="edit-btn">返回修改</button>
  </section>
</main>

<footer class="foot">静态页面 + Cloudflare Worker · 数据存储于 Cloudflare KV · 无统计脚本</footer>

<script src="app.js"></script>
</body>
</html>
